<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floor plan in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe4e8; --panel:rgba(255,255,255,.9); --text:#1d2833; --muted:#5b6875;
  --accent:#2f5d8a; --line:rgba(29,40,51,.14); --btn:#ffffff; --btn-on:#2f5d8a; --btn-on-text:#ffffff;
  --ground:#cfd5da;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c2228; --panel:rgba(32,40,48,.92); --text:#e6ebef; --muted:#9aa7b3;
    --accent:#7fb0de; --line:rgba(230,235,239,.14); --btn:#28323c; --btn-on:#7fb0de; --btn-on-text:#10161c;
    --ground:#252d35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c2228; --panel:rgba(32,40,48,.92); --text:#e6ebef; --muted:#9aa7b3;
  --accent:#7fb0de; --line:rgba(230,235,239,.14); --btn:#28323c; --btn-on:#7fb0de; --btn-on-text:#10161c;
  --ground:#252d35;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;touch-action:none}
.panel{
  position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);
  max-width:min(330px,calc(100% - 24px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
h1{font-size:1.05rem;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.rooms{margin:0 0 12px;padding:0;list-style:none;font-size:.88rem;line-height:1.5;color:var(--muted)}
.rooms b{color:var(--text);font-weight:500}
.goto{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.goto label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select{
  font:inherit;font-size:.9rem;padding:8px 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--btn);color:var(--text);cursor:pointer;
}
.controls{display:flex;flex-wrap:wrap;gap:6px}
button{
  font:inherit;font-size:.82rem;padding:7px 10px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:var(--btn);color:var(--text);
}
button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-text);border-color:transparent}
button[hidden]{display:none}
.tod{margin-bottom:10px}
.tod label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tod label span{color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:0}
.tod input{width:100%;margin:6px 0;accent-color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:4px}
.presets button{font-size:.75rem;padding:4px 7px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.phead h1{margin:0}
#pbody{margin-top:8px}
.panel.collapsed{padding:8px 10px 8px 14px}
.panel.collapsed #pbody{display:none}
.min{padding:2px 9px;font-size:1rem;line-height:1.4}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint[hidden],.rooms[hidden]{display:none}
.hint{
  position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  font-size:.8rem;color:var(--muted);background:var(--panel);padding:6px 10px;border-radius:6px;border:1px solid var(--line);
  max-width:calc(100% - 24px)
}
.tip{
  position:fixed;z-index:5;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 11px;font-size:.84rem;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.16);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
}
.tip b{display:block;font-weight:700}
.tip span{color:var(--muted)}
.tip[hidden]{display:none}
</style>
</head>
<body>
<div id="scene"></div>

<div class="panel">
  <div class="phead">
    <h1>Floor plan, 3D</h1>
    <button id="btnMin" class="min" aria-expanded="true" aria-controls="pbody" title="Minimise">▾</button>
  </div>
  <div id="pbody">
  <ul class="rooms">
    <li><b>Bedroom</b> 3.5 × 4.1 m, 14.4 m²</li>
    <li><b>Room B</b> 8 × 4.5 m, open plan kitchen and lounge</li>
    <li><b>Bathroom</b> 1.3 × 2.5 m, shower, WC and sink</li>
    <li><b>Mezzanine</b> over the bathroom, double bed, ladder</li>
  </ul>
  <div class="goto">
    <label for="goto">Walk through</label>
    <select id="goto">
      <option value="overview">Overview (outside)</option>
      <option value="entrance">Go to entrance</option>
      <option value="lounge">Go to lounge</option>
      <option value="kitchen">Go to kitchen</option>
      <option value="bathroom">Go to bathroom</option>
      <option value="bedroom">Go to bedroom</option>
      <option value="mezzanine">Go to mezzanine</option>
    </select>
  </div>
  <div class="tod">
    <label for="tod">Sun <span id="todVal">13:00</span></label>
    <input type="range" id="tod" min="4" max="22" step="0.25" value="13">
    <div class="presets">
      <button data-h="6.2">Sunrise</button><button data-h="9">Morning</button><button data-h="13">Midday</button>
      <button data-h="16.5">Afternoon</button><button data-h="19.8">Sunset</button><button data-h="21.5">Night</button>
    </div>
  </div>
  <div class="controls">
    <button id="btnRoof" aria-pressed="false">Show roof</button>
    <button id="btnText" aria-pressed="false">Hide text</button>
    <button id="btnCut" aria-pressed="false">Cut walls down</button>
    <button id="btnTop">Top view</button>
    <button id="btnReset">Reset view</button>
    <button id="btnVR" hidden>Enter VR</button>
  </div>
  </div>
</div>
<div class="hint" id="hint"></div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  // ---- Plan data (metres). x runs left to right, z runs back (0) to front ----
  const T = 0.15, FULL_H = 2.5, DOOR_H = 2.1, SILL = 0.9, WIN_TOP = 2.1;
  const EYE = 1.6;
  const ROOM_A = [1.75, 2.05], ROOM_B = [7.5, 2.25], BATH = [4.15, 1.2];
  const NX = 0.4, NZ = 3.6;       // bedroom corner notch
  const BX = 4.8, BZ = 2.5;
  const DECK = 2.1;               // mezzanine floor level       // bathroom: x 3.5 to BX, z 0 to BZ
  const OFF = [-5.75, -2.25]; // model offset so the plan is centred

  // ext: outside face is stone. e0/e1: how far the wall runs past its start/end (corners)
  const H = T/2;
  const walls = [
    { a:[0,0],    b:[11.5,0],  ext:true, s0:1, s1:1, inside:[5.75,2.25], open:[] },
    { a:[0,0],    b:[0,NZ],    ext:true, s1:1, inside:ROOM_A, e0:-H, open:[{s:0.55,e:1.05,k:'window',y0:0.9,y1:1.9}] },
    { a:[0,NZ],   b:[NX,NZ],   ext:true, inside:ROOM_A, e0:-H, open:[] },            // corner notch
    { a:[NX,NZ],  b:[NX,4.1],  ext:true, s1:1, inside:ROOM_A, e0:-H, open:[] },
    { a:[NX,4.1], b:[3.5,4.1], ext:true, inside:ROOM_A, e0:-H, open:[{s:1.3-NX,e:2.2-NX,k:'door',room:ROOM_A}] },
    { a:[3.5,0],  b:[3.5,4.1], e0:-H, e1:-H, open:[{s:2.6,e:3.6,k:'gap',h:1.95}] },
    { a:[3.5,4.1],b:[3.5,4.5], ext:true, s1:1, inside:ROOM_B, e0:-H, open:[] },
    { a:[3.5,4.5],b:[11.5,4.5],ext:true, s1:1, inside:ROOM_B, e0:-H, open:[{s:1.1,e:2.4,k:'glassdoor',h:1.95},{s:4.5,e:6.0,k:'glassdoor'}] },
    { a:[11.5,0], b:[11.5,4.5],ext:true, inside:ROOM_B, e0:-H, e1:-H, open:[{s:3.1,e:4.0,k:'door',room:ROOM_B,arch:true,spring:1.95}] },
    { a:[BX,0],   b:[BX,BZ],   t:0.1, h:DECK-0.1, e0:-H, open:[{s:BZ-0.75,e:BZ-0.05,k:'door',room:BATH,hinge:'e',ang:88,h:1.9}] },
    { a:[3.5,BZ], b:[BX,BZ],   t:0.1, h:DECK-0.1, e0:-H, e1:-0.05, open:[] }
  ];

  let wallH = FULL_H;

  // ---- Three.js setup ----
  const host = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.05, 200);
  camera.rotation.order = 'YXZ';
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI/2.05;
  controls.minDistance = 4; controls.maxDistance = 45;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f94, 0.75); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(-8, 14, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, {left:-20,right:20,top:20,bottom:-20,near:1,far:90});
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // ---- Time of day: sun path, colour and sky ----
  // Assumes the front (glass doors) faces south: sun rises on the right-hand side (east), sets on the left (west).
  let tod = 13;
  const C = h => new THREE.Color(h);
  const clamp01 = v => Math.min(1, Math.max(0, v));
  function setTime(h){
    tod = h;
    const t = (h - 6) / 14 * Math.PI;              // 06:00 east, 13:00 south, 20:00 west
    const e = Math.sin(t) * 0.95;                  // elevation, max about 54 degrees
    const up = Math.sin(e);
    const warm = 1 - clamp01(up / 0.45);           // 1 at the horizon, 0 high in the sky
    if (up > -0.03){
      const ce = Math.cos(e), el = Math.max(up, 0.03);
      sun.position.set(Math.cos(t)*ce*30, el*30, Math.sin(t)*ce*30);
      sun.color.copy(C(0xffffff).lerp(C(0xff7a30), warm*0.9));
      sun.intensity = 0.9 * clamp01((up + 0.03) / 0.15);
    } else {                                         // moonlight
      sun.position.set(-10, 22, 12);
      sun.color.set(0x9db4ff); sun.intensity = 0.12;
    }
    let sky;
    if (up >= 0) sky = C(0xf2a679).lerp(C(0xbcd6ea), clamp01(up / 0.4));
    else sky = C(0xf2a679).lerp(C(0x0e1526), clamp01(-up / 0.15));
    scene.background = sky;
    const night = clamp01(-up / 0.15);
    hemi.color.copy(C(0xdfefff).lerp(C(0xffc49a), warm*0.8).lerp(C(0x2a3a60), night));
    hemi.groundColor.copy(C(0x8a8f94).lerp(C(0x1a1d24), night));
    hemi.intensity = 0.75 - 0.35*warm*(1-night) - 0.55*night;
    renderer.shadowMap.needsUpdate = true;
  }

  const groundMat = new THREE.MeshStandardMaterial({color:0xcfd5da, roughness:1});
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMat);
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.03; ground.receiveShadow = true;
  scene.add(ground);

  const model = new THREE.Group();
  model.position.set(OFF[0], 0, OFF[1]);
  scene.add(model);

  const mats = {
    wall: new THREE.MeshStandardMaterial({color:0xf3f0ea, roughness:0.92}),
    floorA: new THREE.MeshStandardMaterial({color:0xc9a77c, roughness:0.8}),
    floorB: new THREE.MeshStandardMaterial({color:0xbf9b6e, roughness:0.8}),
    door: new THREE.MeshStandardMaterial({color:0x6f5039, roughness:0.7}),
    glass: new THREE.MeshStandardMaterial({color:0x9cc7de, roughness:0.1, metalness:0.1, transparent:true, opacity:0.38}),
    frame: new THREE.MeshStandardMaterial({color:0x4a535c, roughness:0.6}),
    white: new THREE.MeshStandardMaterial({color:0xf7f6f2, roughness:0.6}),
    roof: new THREE.MeshStandardMaterial({color:0xf1efea, roughness:0.9, side:THREE.DoubleSide})
  };

  // Grey stone texture (tileable), 1 texture tile = 1.6 m
  function makeStone(){
    // rounded rubble stones in warm greys and browns, packed with dark joints (tileable)
    const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = '#6e665d'; g.fillRect(0,0,S,S);
    let rnd = 11; const R = () => (rnd = (rnd*16807) % 2147483647) / 2147483647;
    const palette = [[156,150,141],[178,171,160],[196,189,177],[143,128,112],[165,145,124],[128,124,118],[205,198,186],[150,138,126]];
    const stones = [];
    function addStone(x, y, r){
      const base = palette[Math.floor(R()*palette.length)], v = (R()-0.5)*30;
      const pts = [], n = 9 + Math.floor(R()*5), flat = 0.6 + R()*0.3;
      for (let i=0;i<n;i++){
        const a = i/n*Math.PI*2 + (R()-0.5)*0.4, k = 0.72 + R()*0.38;
        pts.push([Math.cos(a)*r*k, Math.sin(a)*r*k*flat]);
      }
      stones.push({x, y, rot:(R()-0.5)*0.9, col:base.map(c => Math.max(0, Math.min(255, c + v))), pts, r});
    }
    for (let i=0;i<340;i++) addStone(R()*S, R()*S, 7 + R()*10);          // small fillers
    const cell = 58;
    for (let gy = 0; gy < S/cell; gy++) for (let gx = 0; gx < S/cell; gx++){
      const big = R() < 0.25;
      addStone((gx+0.5)*cell + (R()-0.5)*cell*0.6, (gy+0.5)*cell + (R()-0.5)*cell*0.6,
               cell*(big ? 0.62 + R()*0.18 : 0.38 + R()*0.2));
    }
    const path = (p) => {
      g.beginPath();
      for (let i=0;i<p.length;i++){
        const a = p[i], b = p[(i+1)%p.length], m = [(a[0]+b[0])/2, (a[1]+b[1])/2];
        if (i === 0) g.moveTo(m[0], m[1]); else g.quadraticCurveTo(a[0], a[1], m[0], m[1]);
      }
      const a = p[0], b = p[1]; g.quadraticCurveTo(a[0], a[1], (a[0]+b[0])/2, (a[1]+b[1])/2);
      g.closePath();
    };
    stones.forEach(st => {
      for (const ox of [-S,0,S]) for (const oy of [-S,0,S]){
        const cx = st.x + ox, cy = st.y + oy;
        if (cx < -st.r*1.3 || cx > S+st.r*1.3 || cy < -st.r*1.3 || cy > S+st.r*1.3) continue;
        g.save(); g.translate(cx, cy); g.rotate(st.rot);
        // drop shadow in the joint
        g.save(); g.translate(2, 3); path(st.pts); g.fillStyle = 'rgba(25,20,16,0.55)'; g.fill(); g.restore();
        path(st.pts);
        const [r0,g0,b0] = st.col;
        g.rotate(-st.rot);
        const gr = g.createRadialGradient(-st.r*0.35, -st.r*0.4, st.r*0.1, 0, 0, st.r*1.05);
        gr.addColorStop(0, `rgb(${Math.min(255,r0+22)},${Math.min(255,g0+20)},${Math.min(255,b0+18)})`);
        gr.addColorStop(0.6, `rgb(${r0},${g0},${b0})`);
        gr.addColorStop(1, `rgb(${r0*0.62|0},${g0*0.6|0},${b0*0.58|0})`);
        g.fillStyle = gr; g.fill();
        g.save(); g.clip();
        for (let i=0;i<70;i++){   // granite speckles
          const d = R() < 0.5 ? 0 : 255;
          g.fillStyle = `rgba(${d},${d},${d},${0.08 + R()*0.12})`;
          g.fillRect((R()-0.5)*st.r*2, (R()-0.5)*st.r*2, 1.5 + R()*1.5, 1.5 + R()*1.5);
        }
        g.restore();
        g.restore();
      }
    });
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1/1.6, 1/1.6);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  // soft vertical gradient on plaster so walls read apart from each other
  (function(){
    const c = document.createElement('canvas'); c.width = 4; c.height = 256;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#fbfaf7'); gr.addColorStop(0.55, '#ece8e1');
    gr.addColorStop(0.95, '#d3cdc3'); gr.addColorStop(0.96, '#bdb6ab'); gr.addColorStop(1, '#bdb6ab');
    g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
    t.repeat.set(1, 1/FULL_H);
    mats.wall.map = t; mats.wall.color.set(0xffffff); mats.wall.needsUpdate = true;
  })();
  const stoneTex = makeStone();
  mats.stone = new THREE.MeshStandardMaterial({map:stoneTex, roughness:0.97});
  mats.stoneDS = new THREE.MeshStandardMaterial({map:stoneTex, roughness:0.95, side:THREE.DoubleSide});

  // White eave trim with a grey pattern, like the border in the photo
  function makeTrim(){
    const c = document.createElement('canvas'); c.width = 256; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#f4f2ee'; g.fillRect(0,0,256,64);
    g.fillStyle = '#8b9096'; g.fillRect(0,6,256,4); g.fillRect(0,54,256,4);
    for (let i=0;i<8;i++){
      g.beginPath(); g.moveTo(i*32+4,46); g.lineTo(i*32+16,18); g.lineTo(i*32+28,46); g.fill();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1/0.5, 1/0.13);
    return t;
  }
  mats.trim = new THREE.MeshStandardMaterial({map:makeTrim(), roughness:0.8});

  // Box UVs in metres so textures keep their real-world scale
  function scaleUV(geo, sx, sy, sz, ox, oy){
    const uv = geo.attributes.uv;
    const f = [[sz,sy,0,oy],[sz,sy,0,oy],[sx,sz,ox,0],[sx,sz,ox,0],[sx,sy,ox,oy],[sx,sy,ox,oy]];
    for (let i=0;i<24;i++){
      const [su,sv,ou,ov] = f[Math.floor(i/4)];
      uv.setXY(i, uv.getX(i)*su + (ou||0), uv.getY(i)*sv + (ov||0));
    }
    uv.needsUpdate = true;
  }

  // Walkable floors
  const floorsG = new THREE.Group(); model.add(floorsG);
  function floorSlab(x0, x1, y0, y1, z0, z1, mat){
    const m = new THREE.Mesh(new THREE.BoxGeometry(x1-x0, y1-y0, z1-z0), mat);
    m.position.set((x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
    m.receiveShadow = true; m.userData.floor = true;
    floorsG.add(m);
  }
  floorSlab(0,3.5, -0.04,0, 0,4.1, mats.floorA);
  floorSlab(3.5,11.5, -0.04,0, 0,4.5, mats.floorB);

  // Room labels (hidden while walking)
  const labels = [];
  function label(title, sub){
    const c = document.createElement('canvas');
    c.width = 512; c.height = 150;
    const g = c.getContext('2d');
    const r = 22;
    g.fillStyle = 'rgba(255,255,255,0.93)';
    g.beginPath();
    g.moveTo(r,0); g.arcTo(512,0,512,150,r); g.arcTo(512,150,0,150,r); g.arcTo(0,150,0,0,r); g.arcTo(0,0,512,0,r);
    g.fill();
    g.fillStyle = '#1d2833'; g.textAlign = 'center';
    g.font = '700 52px Archivo, system-ui, sans-serif'; g.fillText(title, 256, 66);
    g.fillStyle = '#2f5d8a';
    g.font = '500 40px Archivo, system-ui, sans-serif'; g.fillText(sub, 256, 120);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false, transparent:true}));
    s.scale.set(2.2, 0.65, 1); s.renderOrder = 10;
    return s;
  }
  [['Bedroom','3.5 × 4.1 m',1.75,2.0],['Bathroom','1.3 × 2.5 m',4.15,1.25],
   ['Kitchen','Open plan',9.4,1.2],['Lounge','Open plan',6.95,3.3],
   ['Mezzanine','Sleeping deck',4.7,2.25,3.7]].forEach(([t,s,x,z,y]) => {
    const l = label(t, s); l.position.set(x, y || 2.9, z); model.add(l); labels.push(l);
  });

  // ---- Walls with openings ----
  const built = new THREE.Group(); model.add(built);
  function clear(){
    while (built.children.length){
      const o = built.children.pop();
      o.traverse(n => { if (n.geometry) n.geometry.dispose(); });
    }
  }
  function addBox(w, u0, u1, y0, y1, mat, thick, off){
    y1 = Math.min(y1, wallH);
    if (y1 - y0 <= 0.001 || u1 - u0 <= 0.001) return;
    const th = thick || w.t || T;
    const geo = new THREE.BoxGeometry(u1-u0, y1-y0, th);
    let material = mat;
    if (mat === mats.wall){
      scaleUV(geo, u1-u0, y1-y0, th, u0, y0);
      if (w.ext){
        material = w.matArr.slice();
        material[0] = (w.s1 && Math.abs(u1 - w.uEnd) < 1e-6) ? mats.stone : mats.wall;
        material[1] = (w.s0 && Math.abs(u0 - w.uStart) < 1e-6) ? mats.stone : mats.wall;
      }
    }
    const m = new THREE.Mesh(geo, material);
    const um = (u0+u1)/2, o = off || 0;
    m.position.set(w.a[0] + w.d[0]*um - w.d[1]*o, (y0+y1)/2, w.a[1] + w.d[1]*um + w.d[0]*o);
    m.rotation.y = Math.atan2(-w.d[1], w.d[0]);
    m.castShadow = !mat.transparent; m.receiveShadow = true;
    built.add(m);
  }
  function addWallShape(w, shape, mat, depth, off){
    const g = new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled:false});
    g.translate(0, 0, -depth/2 + (off || 0));
    const m = new THREE.Mesh(g, mat);
    m.position.set(w.a[0], 0, w.a[1]); m.rotation.y = Math.atan2(-w.d[1], w.d[0]);
    m.castShadow = true; m.receiveShadow = true;
    built.add(m); return m;
  }
  function addDoorLeaf(w, op){
    const width = op.e - op.s - 0.04;
    const h = Math.min((op.h || DOOR_H) - 0.02, wallH);
    let n = [-w.d[1], w.d[0]];
    const mid = [w.a[0] + w.d[0]*(op.s+op.e)/2, w.a[1] + w.d[1]*(op.s+op.e)/2];
    if ((op.room[0]-mid[0])*n[0] + (op.room[1]-mid[1])*n[1] < 0) n = [-n[0], -n[1]];
    const ang = (op.ang || 70)*Math.PI/180;
    const dd = op.hinge === 'e' ? [-w.d[0], -w.d[1]] : w.d;
    const v = [Math.cos(ang)*dd[0] + Math.sin(ang)*n[0], Math.cos(ang)*dd[1] + Math.sin(ang)*n[1]];
    const pivot = new THREE.Group();
    const hinge = op.hinge === 'e' ? op.e - 0.02 : op.s + 0.02, wt = w.t || T;
    pivot.position.set(w.a[0] + w.d[0]*hinge + n[0]*wt/2, 0, w.a[1] + w.d[1]*hinge + n[1]*wt/2);
    pivot.rotation.y = Math.atan2(-v[1], v[0]);
    let leaf;
    if (op.arch && wallH >= FULL_H){
      const r = width/2, sp = op.spring, ls = new THREE.Shape();
      ls.moveTo(0, 0); ls.lineTo(width, 0); ls.lineTo(width, sp);
      for (let i=1;i<32;i++){ const a = Math.PI*i/32; ls.lineTo(r + r*Math.cos(a), sp + r*Math.sin(a)); }
      ls.lineTo(0, sp);
      const g = new THREE.ExtrudeGeometry(ls, {depth:0.045, bevelEnabled:false}); g.translate(0, 0, -0.0225);
      leaf = new THREE.Mesh(g, mats.door);
    } else {
      leaf = new THREE.Mesh(new THREE.BoxGeometry(width, h, 0.045), mats.door);
      leaf.position.set(width/2, h/2, 0);
    }
    leaf.castShadow = true;
    pivot.add(leaf); built.add(pivot);
    const pts = [];
    for (let i=0;i<=24;i++){
      const t = ang*i/24;
      pts.push(new THREE.Vector3(
        pivot.position.x + (Math.cos(t)*dd[0] + Math.sin(t)*n[0])*width, 0.01,
        pivot.position.z + (Math.cos(t)*dd[1] + Math.sin(t)*n[1])*width));
    }
    const arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineDashedMaterial({color:0x2f5d8a, dashSize:0.08, gapSize:0.06}));
    arc.computeLineDistances(); built.add(arc);
  }
  function build(){
    clear();
    walls.forEach(w => {
      const L = Math.hypot(w.b[0]-w.a[0], w.b[1]-w.a[1]);
      w.d = [(w.b[0]-w.a[0])/L, (w.b[1]-w.a[1])/L];
      const wt = w.t || T;
      const e0 = w.e0 !== undefined ? w.e0 : wt/2, e1 = w.e1 !== undefined ? w.e1 : wt/2;
      let cur = -e0;
      const wh = w.h || FULL_H;
      w.uStart = -e0; w.uEnd = L + e1;
      if (w.ext){
        const n1 = [-w.d[1], w.d[0]];
        const m = [(w.a[0]+w.b[0])/2, (w.a[1]+w.b[1])/2];
        w.out = ((m[0]-w.inside[0])*n1[0] + (m[1]-w.inside[1])*n1[1]) > 0 ? 1 : -1;
        const S = mats.stone, P = mats.wall;
        w.matArr = [S, S, P, P, w.out > 0 ? S : P, w.out > 0 ? P : S];
      }
      w.open.slice().sort((p,q)=>p.s-q.s).forEach(op => {
        if (op.s > cur) addBox(w, cur, op.s, 0, wh, mats.wall);
        const kind = op.k, DH = op.h || DOOR_H;
        if (w.ext && op.arch && wallH >= wh){
          const o = w.out * (wt/2 + 0.012), b = 0.1, r = (op.e-op.s)/2, c = (op.s+op.e)/2, sp = op.spring;
          addBox(w, op.s-b, op.s, 0, sp, mats.white, 0.025, o);
          addBox(w, op.e, op.e+b, 0, sp, mats.white, 0.025, o);
          const ring = new THREE.Shape(), r2 = r + b;
          ring.moveTo(c + r2, sp);
          for (let i=1;i<=32;i++){ const a = Math.PI*i/32; ring.lineTo(c + r2*Math.cos(a), sp + r2*Math.sin(a)); }
          ring.lineTo(c - r, sp);
          for (let i=31;i>=1;i--){ const a = Math.PI*i/32; ring.lineTo(c + r*Math.cos(a), sp + r*Math.sin(a)); }
          addWallShape(w, ring, mats.white, 0.025, o);
        } else if (w.ext && (kind === 'door' || kind === 'glassdoor')){
          const o = w.out * (wt/2 + 0.012), b = 0.1;
          addBox(w, op.s-b, op.s, 0, DH+b, mats.white, 0.025, o);
          addBox(w, op.e, op.e+b, 0, DH+b, mats.white, 0.025, o);
          addBox(w, op.s-b, op.e+b, DH, DH+b, mats.white, 0.025, o);
        }
        if (w.ext && kind === 'window'){
          const o = w.out * (wt/2 + 0.012), b = 0.08, y0 = op.y0 || SILL, y1 = op.y1 || WIN_TOP;
          addBox(w, op.s-b, op.s, y0-b, y1+b, mats.white, 0.025, o);
          addBox(w, op.e, op.e+b, y0-b, y1+b, mats.white, 0.025, o);
          addBox(w, op.s, op.e, y1, y1+b, mats.white, 0.025, o);
          addBox(w, op.s, op.e, y0-b, y0, mats.white, 0.025, o);
        }
        if (kind === 'door' && op.arch && wallH >= wh){
          // wall above the opening with a semicircular arch cut out
          const r = (op.e-op.s)/2, c = (op.s+op.e)/2, sp = op.spring;
          const sh = new THREE.Shape();
          sh.moveTo(op.s, sp); sh.lineTo(op.s, wh); sh.lineTo(op.e, wh); sh.lineTo(op.e, sp);
          for (let i=1;i<32;i++){ const a = Math.PI*i/32; sh.lineTo(c + r*Math.cos(a), sp + r*Math.sin(a)); }
          addWallShape(w, sh, mats.wall, wt, 0);
          if (w.ext){
            const f = new THREE.Mesh(new THREE.ShapeGeometry(sh), mats.stoneDS);
            f.geometry.translate(0, 0, w.out*(wt/2 + 0.003));
            f.position.set(w.a[0], 0, w.a[1]); f.rotation.y = Math.atan2(-w.d[1], w.d[0]);
            built.add(f);
          }
          addDoorLeaf(w, op);
        } else if (kind === 'door' || kind === 'gap'){
          addBox(w, op.s, op.e, DH, wh, mats.wall);
          if (kind === 'door') addDoorLeaf(w, op);
        } else if (kind === 'glassdoor'){
          addBox(w, op.s, op.e, DH, wh, mats.wall);
          const mid = (op.s+op.e)/2, f = 0.05;
          addBox(w, op.s, op.s+f, 0, DH, mats.frame, T);
          addBox(w, op.e-f, op.e, 0, DH, mats.frame, T);
          addBox(w, op.s, op.e, DH-f, DH, mats.frame, T);
          addBox(w, op.s, op.e, 0, 0.03, mats.frame, T);
          [[op.s+f, mid+0.04, -0.03], [mid-0.04, op.e-f, 0.03]].forEach(([u0,u1,o]) => {
            addBox(w, u0, u1, 0.03, DH-f, mats.glass, 0.02, o);
            addBox(w, u0, u0+0.04, 0.03, DH-f, mats.frame, 0.04, o);
            addBox(w, u1-0.04, u1, 0.03, DH-f, mats.frame, 0.04, o);
          });
        } else {
          const y0 = op.y0 || SILL, y1 = op.y1 || WIN_TOP;
          addBox(w, op.s, op.e, 0, y0, mats.wall);
          addBox(w, op.s, op.e, y1, wh, mats.wall);
          addBox(w, op.s, op.e, y0, y1, mats.glass, 0.02);
          addBox(w, op.s, op.s+0.04, y0, y1, mats.frame, 0.05);
          addBox(w, op.e-0.04, op.e, y0, y1, mats.frame, 0.05);
          addBox(w, op.s, op.e, y0, y0+0.04, mats.frame, 0.05);
          addBox(w, op.s, op.e, y1-0.04, y1, mats.frame, 0.05);
        }
        cur = op.e;
      });
      addBox(w, cur, L + e1, 0, wh, mats.wall);
    });
  }

  function goOrbit(view){
    mode = 'orbit'; marker.visible = false; show(null);
    labels.forEach(l => l.visible = false);
    sel.value = 'overview';
    animateTo(view.pos, quatLookAt(view.pos, view.target), ORBIT_FOV, 1400, () => {
      controls.target.copy(view.target);
      controls.enabled = true;
      syncVis();
      controls.update();
    });
    setHint();
  }

  // ---- Hover popover, floor marker, click to move ----
  const tip = document.getElementById('tip');
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  const hl = new THREE.Box3Helper(new THREE.Box3(), 0x2f5d8a);
  hl.visible = false; scene.add(hl);
  const marker = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.22, 40),
    new THREE.MeshBasicMaterial({color:0x2f5d8a, transparent:true, opacity:0.85, depthTest:false}));
  marker.rotation.x = -Math.PI/2; marker.renderOrder = 11; marker.visible = false;
  scene.add(marker);

  function firstHit(cx, cy){
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
    ray.setFromCamera(ptr, camera);
    const seen = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
    const hits = ray.intersectObjects([built, furn, tall, floorsG, roofG], true).filter(h => seen(h.object));
    return hits[0] || null;
  }
  function itemOf(hit){
    let o = hit && hit.object;
    while (o && !(o.userData && o.userData.info)) o = o.parent;
    return o || null;
  }
  function show(it, cx, cy){
    if (!it){ tip.hidden = true; hl.visible = false; return; }
    tip.innerHTML = '<b></b><span></span>';
    tip.querySelector('b').textContent = it.userData.info.name;
    tip.querySelector('span').textContent = it.userData.info.dims;
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = cx + 14, y = cy + 14;
    if (x + w > window.innerWidth - 8) x = cx - w - 14;
    if (y + h > window.innerHeight - 8) y = cy - h - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
    hl.box.setFromObject(it); hl.visible = true;
  }
  function hover(cx, cy){
    const hit = firstHit(cx, cy);
    const it = itemOf(hit);
    show(it, cx, cy);
    const onFloor = mode === 'walk' && !anim && hit && hit.object.userData.floor;
    marker.visible = !!onFloor;
    if (onFloor) marker.position.set(hit.point.x, hit.point.y + 0.012, hit.point.z);
    renderer.domElement.style.cursor = (it || onFloor) ? 'pointer' : (mode === 'walk' ? 'grab' : '');
  }
  function walkTo(point){
    const zM = point.z - OFF[1];
    const pos = new THREE.Vector3(point.x, point.y > 1 ? Math.min(point.y + 1.0, yA(zM) - 0.2) : EYE, point.z);
    const dist = pos.distanceTo(camera.position);
    marker.visible = false;
    animateTo(pos, camera.quaternion, camera.fov, Math.min(1400, Math.max(450, dist*380)));
  }

  let down = null, dragging = false, last = null;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => {
    down = [e.clientX, e.clientY]; last = [e.clientX, e.clientY]; dragging = false;
    if (mode === 'walk') el.style.cursor = 'grabbing';
  });
  el.addEventListener('pointermove', e => {
    if (down && Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 4) dragging = true;
    if (down && mode === 'walk' && !anim){
      const k = e.pointerType === 'mouse' ? 0.0045 : 0.006;
      yaw += (e.clientX - last[0]) * k;
      pitch = Math.max(-1.3, Math.min(1.3, pitch + (e.clientY - last[1]) * k));
      camera.quaternion.copy(quatFromYawPitch(yaw, pitch));
      show(null); marker.visible = false;
    }
    last = [e.clientX, e.clientY];
    if (e.pointerType !== 'mouse') return;
    if (e.buttons){ show(null); return; }
    hover(e.clientX, e.clientY);
  });
  el.addEventListener('pointerup', e => {
    if (!dragging && !anim){
      const hit = firstHit(e.clientX, e.clientY);
      if (mode === 'walk' && hit && hit.object.userData.floor) walkTo(hit.point);
      else if (e.pointerType !== 'mouse') show(itemOf(hit), e.clientX, e.clientY);
    }
    down = null;
    if (e.pointerType === 'mouse') hover(e.clientX, e.clientY);
  });
  el.addEventListener('pointerleave', () => { show(null); marker.visible = false; });

  // ---- Theme ----
  function applyTheme(){
    const cs = getComputedStyle(document.documentElement);
    setTime(tod);
    groundMat.color.set(cs.getPropertyValue('--ground').trim() || '#cfd5da');
  }
  applyTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  // ---- UI ----
  const sel = document.getElementById('goto');
  sel.addEventListener('change', () => {
    if (sel.value === 'overview') goOrbit(OVERVIEW); else goWalk(sel.value);
    sel.blur();
  });
  const btnCut = document.getElementById('btnCut');
  btnCut.addEventListener('click', () => {
    const on = wallH === FULL_H;
    wallH = on ? 1.0 : FULL_H;
    tall.visible = !on;
    btnCut.setAttribute('aria-pressed', String(on));
    build(); syncVis();
  });
  // time of day controls
  const todIn = document.getElementById('tod'), todVal = document.getElementById('todVal');
  const fmt = h => { const m = Math.round(h*60); return String(Math.floor(m/60)%24).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
  function applyTod(h){ setTime(h); todIn.value = h; todVal.textContent = fmt(h); }
  todIn.addEventListener('input', () => applyTod(parseFloat(todIn.value)));
  let todAnim = 0;
  document.querySelectorAll('.presets button').forEach(b => b.addEventListener('click', () => {
    const from = tod, to = parseFloat(b.dataset.h), t0 = performance.now(), id = ++todAnim;
    (function step(){
      if (id !== todAnim) return;
      const k = Math.min(1, (performance.now() - t0) / 900), e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
      applyTod(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    })();
  }));

  // minimise / expand the options box (remembered in this browser)
  const panel = document.querySelector('.panel'), btnMin = document.getElementById('btnMin');
  function setMin(on){
    panel.classList.toggle('collapsed', on);
    btnMin.textContent = on ? '▸' : '▾';
    btnMin.title = on ? 'Show options' : 'Minimise';
    btnMin.setAttribute('aria-expanded', String(!on));
    try { localStorage.setItem('panelMin', on ? '1' : '0'); } catch (e) {}
  }
  btnMin.addEventListener('click', () => setMin(!panel.classList.contains('collapsed')));
  try { if (localStorage.getItem('panelMin') === '1') setMin(true); } catch (e) {}

  const btnText = document.getElementById('btnText');
  btnText.addEventListener('click', () => {
    textOff = !textOff;
    btnText.setAttribute('aria-pressed', String(textOff));
    btnText.textContent = textOff ? 'Show text' : 'Hide text';
    syncVis();
  });
  const btnRoof = document.getElementById('btnRoof');
  btnRoof.addEventListener('click', () => {
    roofOn = !roofOn;
    btnRoof.setAttribute('aria-pressed', String(roofOn));
    syncVis();
  });
  document.getElementById('btnTop').addEventListener('click', () => goOrbit(TOP));
  document.getElementById('btnReset').addEventListener('click', () => goOrbit(OVERVIEW));
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && mode === 'walk') goOrbit(OVERVIEW); });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // initial view
  camera.position.copy(OVERVIEW.pos);
  controls.target.copy(OVERVIEW.target);
  controls.update();
  setHint();
  syncVis();

  // ---- VR walk-through (WebXR, e.g. Meta Quest Browser) ----
  renderer.xr.enabled = true;
  const rig = new THREE.Group(); scene.add(rig); rig.add(camera);
  const vrBtn = document.getElementById('btnVR');
  const vrRay = new THREE.Raycaster(), tmpM = new THREE.Matrix4(), Y = new THREE.Vector3(0,1,0);
  const visible = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
  const ctrls = [0, 1].map(i => {
    const c = renderer.xr.getController(i);
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
      new THREE.LineBasicMaterial({color:0x7fb0de}));
    line.scale.z = 5; c.add(line); c.userData.line = line;
    c.addEventListener('selectend', () => { if (c.userData.target) vrTeleport(c.userData.target); });
    rig.add(c);
    const grip = renderer.xr.getControllerGrip(i);
    grip.add(new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 0.12), new THREE.MeshStandardMaterial({color:0x2f3a44})));
    rig.add(grip);
    return c;
  });
  const headPos = () => new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera(camera).matrixWorld);
  function vrTeleport(p){
    const head = headPos();
    rig.position.x += p.x - head.x; rig.position.z += p.z - head.z;
    rig.position.y = p.y > 1 ? p.y : 0;        // up on the mezzanine deck or down on the ground floor
  }
  function snapTurn(a){
    const head = headPos(), v = rig.position.clone().sub(head).applyAxisAngle(Y, a);
    rig.position.copy(head).add(v); rig.rotation.y += a;
  }
  const turnLatch = {};
  function vrUpdate(){
    let tgt = null;
    ctrls.forEach(c => {
      tmpM.identity().extractRotation(c.matrixWorld);
      vrRay.ray.origin.setFromMatrixPosition(c.matrixWorld);
      vrRay.ray.direction.set(0, 0, -1).applyMatrix4(tmpM);
      const h = vrRay.intersectObjects([built, furn, tall, floorsG, roofG], true).filter(x => visible(x.object))[0];
      c.userData.target = h && h.object.userData.floor ? h.point.clone() : null;
      c.userData.line.scale.z = h ? h.distance : 5;
      if (c.userData.target) tgt = c.userData.target;
    });
    marker.visible = !!tgt;
    if (tgt) marker.position.set(tgt.x, tgt.y + 0.012, tgt.z);
    const session = renderer.xr.getSession();
    if (session) for (const src of session.inputSources){
      const gp = src.gamepad; if (!gp || gp.axes.length < 4) continue;
      const x = gp.axes[2], k = src.handedness;
      if (Math.abs(x) > 0.7 && !turnLatch[k]){ snapTurn(x > 0 ? -Math.PI/6 : Math.PI/6); turnLatch[k] = true; }
      else if (Math.abs(x) < 0.3) turnLatch[k] = false;
    }
  }
  async function enterVR(){
    const session = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor', 'bounded-floor']});
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);
    anim = null; mode = 'walk'; controls.enabled = false; show(null); syncVis();
    camera.position.set(0, 0, 0); camera.quaternion.identity();
    const s = SPOTS.lounge;
    rig.position.set(s.x + OFF[0], 0, s.z + OFF[1]); rig.rotation.set(0, s.yaw, 0);
    renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;   // static scene, lighter on the headset
    vrBtn.textContent = 'Exit VR';
    session.addEventListener('end', () => {
      rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0);
      renderer.shadowMap.autoUpdate = true;
      camera.fov = ORBIT_FOV; camera.updateProjectionMatrix();
      camera.position.copy(OVERVIEW.pos); camera.quaternion.copy(quatLookAt(OVERVIEW.pos, OVERVIEW.target));
      mode = 'orbit'; controls.target.copy(OVERVIEW.target); controls.enabled = true;
      sel.value = 'overview'; marker.visible = false; vrBtn.textContent = 'Enter VR';
      syncVis(); setHint();
    });
  }
  if (navigator.xr && navigator.xr.isSessionSupported){
    navigator.xr.isSessionSupported('immersive-vr').then(ok => { vrBtn.hidden = !ok; }).catch(() => {});
  }
  vrBtn.addEventListener('click', () => {
    const s = renderer.xr.getSession();
    if (s) s.end();
    else enterVR().catch(err => { hint.hidden = false; hint.textContent = 'Could not start VR: ' + err.message; });
  });

  renderer.setAnimationLoop(function loop(){
    if (renderer.xr.isPresenting){ vrUpdate(); renderer.render(scene, camera); return; }
    if (anim){
      const t = Math.min(1, (performance.now() - anim.t0) / anim.dur), e = ease(t);
      camera.position.lerpVectors(anim.p0, anim.p1, e);
      camera.quaternion.copy(anim.q0).slerp(anim.q1, e);
      camera.fov = anim.f0 + (anim.f1 - anim.f0) * e;
      camera.updateProjectionMatrix();
      if (t >= 1){ const cb = anim.onDone; anim = null; if (cb) cb(); }
    } else if (mode === 'orbit'){
      controls.update();
    }
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
