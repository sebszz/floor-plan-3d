<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floor plan in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe4e8; --panel:rgba(255,255,255,.9); --text:#1d2833; --muted:#5b6875;
  --accent:#2f5d8a; --line:rgba(29,40,51,.14); --btn:#ffffff; --btn-on:#2f5d8a; --btn-on-text:#ffffff;
  --ground:#cfd5da;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c2228; --panel:rgba(32,40,48,.92); --text:#e6ebef; --muted:#9aa7b3;
    --accent:#7fb0de; --line:rgba(230,235,239,.14); --btn:#28323c; --btn-on:#7fb0de; --btn-on-text:#10161c;
    --ground:#252d35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c2228; --panel:rgba(32,40,48,.92); --text:#e6ebef; --muted:#9aa7b3;
  --accent:#7fb0de; --line:rgba(230,235,239,.14); --btn:#28323c; --btn-on:#7fb0de; --btn-on-text:#10161c;
  --ground:#252d35;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;touch-action:none}
.panel{
  position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);
  max-width:min(330px,calc(100% - 24px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
h1{font-size:1.05rem;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.rooms{margin:0 0 12px;padding:0;list-style:none;font-size:.88rem;line-height:1.5;color:var(--muted)}
.rooms b{color:var(--text);font-weight:500}
.goto{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.goto label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select{
  font:inherit;font-size:.9rem;padding:8px 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--btn);color:var(--text);cursor:pointer;
}
.controls{display:flex;flex-wrap:wrap;gap:6px}
button{
  font:inherit;font-size:.82rem;padding:7px 10px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:var(--btn);color:var(--text);
}
button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-text);border-color:transparent}
button[hidden]{display:none}
.tod{margin-bottom:10px}
.tod label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tod label span{color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:0}
.tod input{width:100%;margin:6px 0;accent-color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:4px}
.presets button{font-size:.75rem;padding:4px 7px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.phead h1{margin:0}
#pbody{margin-top:8px}
.panel.collapsed{padding:8px 10px 8px 14px}
.panel.collapsed #pbody{display:none}
.min{padding:2px 9px;font-size:1rem;line-height:1.4}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint[hidden],.rooms[hidden]{display:none}
.hint{
  position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  font-size:.8rem;color:var(--muted);background:var(--panel);padding:6px 10px;border-radius:6px;border:1px solid var(--line);
  max-width:calc(100% - 24px)
}
.tip{
  position:fixed;z-index:5;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 11px;font-size:.84rem;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.16);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
}
.tip b{display:block;font-weight:700}
.tip span{color:var(--muted)}
.tip[hidden]{display:none}
</style>
</head>
<body>
<div id="scene"></div>

<div class="panel">
  <div class="phead">
    <h1>Floor plan, 3D</h1>
    <button id="btnMin" class="min" aria-expanded="true" aria-controls="pbody" title="Minimise">▾</button>
  </div>
  <div id="pbody">
  <ul class="rooms">
    <li><b>Bedroom</b> 3.5 × 4.1 m, 14.4 m²</li>
    <li><b>Room B</b> 8 × 4.5 m, open plan kitchen and lounge</li>
    <li><b>Bathroom</b> 1.3 × 2.5 m, shower, WC and sink</li>
    <li><b>Mezzanine</b> over the bathroom, double bed, ladder</li>
  </ul>
  <div class="goto">
    <label for="goto">Walk through</label>
    <select id="goto">
      <option value="overview">Overview (outside)</option>
      <option value="entrance">Go to entrance</option>
      <option value="lounge">Go to lounge</option>
      <option value="kitchen">Go to kitchen</option>
      <option value="bathroom">Go to bathroom</option>
      <option value="bedroom">Go to bedroom</option>
      <option value="mezzanine">Go to mezzanine</option>
      <option value="courtyard">Go to courtyard</option>
      <option value="terrace">Go to garden terrace</option>
    </select>
  </div>
  <div class="tod">
    <label for="tod">Sun <span id="todVal">13:00</span></label>
    <input type="range" id="tod" min="4" max="22" step="0.25" value="13">
    <div class="presets">
      <button data-h="6.2">Sunrise</button><button data-h="9">Morning</button><button data-h="13">Midday</button>
      <button data-h="16.5">Afternoon</button><button data-h="19.8">Sunset</button><button data-h="21.5">Night</button>
    </div>
  </div>
  <div class="goto">
    <label for="quality">Graphics</label>
    <select id="quality">
      <option value="low">Low (fastest)</option>
      <option value="medium">Medium</option>
      <option value="high">High (best looking)</option>
    </select>
  </div>
  <div class="controls">
    <button id="btnLights" aria-pressed="false">Lights: off</button>
    <button id="btnRoof" aria-pressed="false">Show roof</button>
    <button id="btnText" aria-pressed="false">Hide text</button>
    <button id="btnCut" aria-pressed="false">Cut walls down</button>
    <button id="btnTop">Top view</button>
    <button id="btnReset">Reset view</button>
    <button id="btnVR" hidden>Enter VR</button>
  </div>
  </div>
</div>
<div class="hint" id="hint"></div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/lights/RectAreaLightUniformsLib.js"></script>
<script>
(function(){
  // ---- Plan data (metres). x runs left to right, z runs back (0) to front ----
  const T = 0.15, FULL_H = 2.5, DOOR_H = 2.1, SILL = 0.9, WIN_TOP = 2.1;
  const EYE = 1.6;
  const ROOM_A = [1.75, 2.05], ROOM_B = [7.5, 2.25], BATH = [4.15, 1.2];
  const NX = 0.4, NZ = 3.6;       // bedroom corner notch
  const BX = 4.8, BZ = 2.5;
  const DECK = 2.1;               // mezzanine floor level       // bathroom: x 3.5 to BX, z 0 to BZ
  const OFF = [-5.75, -2.25]; // model offset so the plan is centred

  // ext: outside face is stone. e0/e1: how far the wall runs past its start/end (corners)
  const H = T/2;
  const walls = [
    { a:[0,0],    b:[11.5,0],  ext:true, s0:1, s1:1, inside:[5.75,2.25], open:[] },
    { a:[0,0],    b:[0,NZ],    ext:true, s1:1, inside:ROOM_A, e0:-H, open:[{s:0.55,e:1.05,k:'window',y0:0.9,y1:1.9}] },
    { a:[0,NZ],   b:[NX,NZ],   ext:true, inside:ROOM_A, e0:-H, open:[] },            // corner notch
    { a:[NX,NZ],  b:[NX,4.1],  ext:true, s1:1, inside:ROOM_A, e0:-H, open:[] },
    { a:[NX,4.1], b:[3.5,4.1], ext:true, inside:ROOM_A, e0:-H, open:[{s:1.3-NX,e:2.2-NX,k:'door',room:ROOM_A}] },
    { a:[3.5,0],  b:[3.5,4.1], e0:-H, e1:-H, open:[{s:2.6,e:3.6,k:'gap',h:1.95}] },
    { a:[3.5,4.1],b:[3.5,4.5], ext:true, s1:1, inside:ROOM_B, e0:-H, open:[] },
    { a:[3.5,4.5],b:[11.5,4.5],ext:true, s1:1, inside:ROOM_B, e0:-H, open:[{s:1.1,e:2.4,k:'glassdoor',h:1.95},{s:4.5,e:6.0,k:'glassdoor'}] },
    { a:[11.5,0], b:[11.5,4.5],ext:true, inside:ROOM_B, e0:-H, e1:-H, open:[{s:3.1,e:4.0,k:'door',room:ROOM_B,arch:true,spring:1.95}] },
    { a:[BX,0],   b:[BX,BZ],   t:0.1, h:DECK-0.1, e0:-H, open:[{s:BZ-0.75,e:BZ-0.05,k:'door',room:BATH,hinge:'e',ang:88,h:1.9}] },
    { a:[3.5,BZ], b:[BX,BZ],   t:0.1, h:DECK-0.1, e0:-H, e1:-0.05, open:[] }
  ];

  let wallH = FULL_H;

  // ---- Three.js setup ----
  // physically based colour pipeline: colours are converted to linear for lighting, output is sRGB with filmic tone mapping
  THREE.ColorManagement.legacyMode = false;
  { const CT = THREE.CanvasTexture; THREE.CanvasTexture = class extends CT { constructor(...a){ super(...a); this.encoding = THREE.sRGBEncoding; } }; }
  const host = document.getElementById('scene');
  let quality = 'low';
  try { const q = localStorage.getItem('gfxQuality'); if (q === 'medium' || q === 'high') quality = q; } catch (e) {}
  const renderer = new THREE.WebGLRenderer({antialias: quality !== 'low', powerPreference:'high-performance'});
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.physicallyCorrectLights = false;
  const PIXEL = {low:0.75, medium:1.25, high:2};      // Low renders at 3/4 resolution
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, PIXEL[quality]));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = quality === 'low' ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.08, 3000);
  camera.rotation.order = 'YXZ';
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI/2.05;
  controls.minDistance = 4; controls.maxDistance = 90;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f94, 0.75); scene.add(hemi);
  // faint cool moonlight everywhere at night on Medium/High (their bounce lighting is black when every lamp is off)
  const moonAmb = new THREE.AmbientLight(0x9fb3e0, 0); scene.add(moonAmb);
  let nightK = 0;
  function syncMoon(){ moonAmb.intensity = quality === 'low' ? 0 : 0.08 * nightK; }
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(-8, 14, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(quality === 'low' ? 512 : 2048, quality === 'low' ? 512 : 2048);
  Object.assign(sun.shadow.camera, {left:-20,right:20,top:20,bottom:-20,near:1,far:90});
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // ---- Time of day: sun path, colour and sky ----
  // Assumes the front (glass doors) faces south: sun rises on the right-hand side (east), sets on the left (west).
  let tod = 13, envK = 0.5, envMats = null, dayK = 1;
  let probeDirty = true, probeTimer = 0;
  function requestProbe(){ clearTimeout(probeTimer); probeTimer = setTimeout(() => { probeDirty = true; }, 150); }
  const C = h => new THREE.Color(h);
  const skyU = {
    top:{value:new THREE.Color(0x5d8fc9)}, horizon:{value:new THREE.Color(0xc9dcec)}, below:{value:new THREE.Color(0x8aa0b0)},
    sunDir:{value:new THREE.Vector3(0,1,0)}, sunCol:{value:new THREE.Color(1,1,1)}, sunVis:{value:1},
    moonDir:{value:new THREE.Vector3(-10,22,12).normalize()}, moonVis:{value:0}
  };
  const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1200, 48, 24), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `
      uniform vec3 top, horizon, below, sunDir, sunCol, moonDir; uniform float sunVis, moonVis; varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 col = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, below, clamp(-h * 5.0, 0.0, 1.0));
        float c = dot(d, normalize(sunDir));
        float glow = pow(max(c, 0.0), 900.0) * 0.9 + pow(max(c, 0.0), 80.0) * 0.22 + pow(max(c, 0.0), 6.0) * 0.1;
        col += sunCol * glow * sunVis;
        float disc = smoothstep(0.99955, 0.99975, c);
        col = mix(col, vec3(1.0, 0.97, 0.85) * 0.75 + sunCol * 0.45, disc * sunVis);
        float m = dot(d, normalize(moonDir));
        col = mix(col, vec3(0.86, 0.9, 1.0), smoothstep(0.99975, 0.99988, m) * moonVis);
        col += vec3(0.5, 0.6, 0.9) * pow(max(m, 0.0), 300.0) * 0.25 * moonVis;
        gl_FragColor = vec4(pow(max(col, 0.0), vec3(1.0/2.2)), 1.0);
      }`
  }));
  skyDome.renderOrder = -10; skyDome.frustumCulled = false;
  scene.add(skyDome);
  scene.fog = new THREE.Fog(0xc9dcec, 300, 2600);
  const clamp01 = v => Math.min(1, Math.max(0, v));
  function setTime(h){
    tod = h;
    const t = (h - 6) / 14 * Math.PI;              // 06:00 east, 13:00 south, 20:00 west
    const e = Math.sin(t) * 0.95;                  // elevation, max about 54 degrees
    const up = Math.sin(e);
    const warm = 1 - clamp01(up / 0.45);           // 1 at the horizon, 0 high in the sky
    if (up > -0.03){
      const ce = Math.cos(e), el = Math.max(up, 0.03);
      sun.position.set(Math.cos(t)*ce*30, el*30, Math.sin(t)*ce*30);
      sun.color.copy(C(0xffffff).lerp(C(0xff7a30), warm*0.9));
      sun.intensity = 0.9 * clamp01((up + 0.03) / 0.15);
    } else {                                         // moonlight
      sun.position.set(-10, 22, 12);
      sun.color.set(0x9db4ff); sun.intensity = 0.12;
    }
    let sky, top;
    if (up >= 0){ const k = clamp01(up / 0.4); sky = C(0xf4a46a).lerp(C(0xc9dcec), k); top = C(0x5a6c9a).lerp(C(0x4f86c6), k); }
    else { const k = clamp01(-up / 0.15); sky = C(0xf4a46a).lerp(C(0x1a2440), k); top = C(0x5a6c9a).lerp(C(0x050914), k); }
    scene.background = sky;
    skyU.horizon.value.copy(sky); skyU.top.value.copy(top); skyU.below.value.copy(sky).multiplyScalar(0.7);
    if (up > -0.03){ skyU.sunDir.value.copy(sun.position).normalize(); skyU.sunCol.value.copy(sun.color); }
    skyU.sunVis.value = clamp01((up + 0.04) / 0.06);
    skyU.moonVis.value = clamp01(-up / 0.1);
    if (scene.fog) scene.fog.color.copy(sky);
    const night = clamp01(-up / 0.15);
    hemi.color.copy(C(0xdfefff).lerp(C(0xffc49a), warm*0.8).lerp(C(0x2a3a60), night));
    hemi.groundColor.copy(C(0x8a8f94).lerp(C(0x1a1d24), night));
    hemi.intensity = (0.75 - 0.35*warm*(1-night) - 0.55*night) * 0.38;
    envK = 0.004 + 0.28*(1 - night)*(0.55 + 0.45*clamp01(up / 0.4));
    dayK = 1 - night; nightK = night; try { syncFill(); } catch (e) {} syncMoon();
    if (envMats) envMats.forEach(m => m.envMapIntensity = envK * (m.userData.envBoost || 1));
    requestProbe();
    try { applyIndoorEnv(); } catch (e) {}
    renderer.shadowMap.needsUpdate = true;
  }

  const groundMat = new THREE.MeshStandardMaterial({color:0xcfd5da, roughness:1});
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMat);
  ground.visible = false;
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.03; ground.receiveShadow = true;
  scene.add(ground);

  const model = new THREE.Group();
  model.position.set(OFF[0], 0, OFF[1]);
  scene.add(model);

  const mats = {
    wall: new THREE.MeshStandardMaterial({color:0xf3f0ea, roughness:0.92}),
    floorA: new THREE.MeshStandardMaterial({color:0xc9a77c, roughness:0.8}),
    floorB: new THREE.MeshStandardMaterial({color:0xbf9b6e, roughness:0.8}),
    door: new THREE.MeshStandardMaterial({color:0x6f5039, roughness:0.7}),
    glass: new THREE.MeshStandardMaterial({color:0x9cc7de, roughness:0.1, metalness:0.1, transparent:true, opacity:0.38}),
    frame: new THREE.MeshStandardMaterial({color:0x4a535c, roughness:0.6}),
    white: new THREE.MeshStandardMaterial({color:0xf7f6f2, roughness:0.6}),
    roof: new THREE.MeshStandardMaterial({color:0xf1efea, roughness:0.9, side:THREE.DoubleSide})
  };

  // Grey stone texture (tileable), 1 texture tile = 1.6 m
  function makeStone(){
    // rounded rubble stones in warm greys and browns, packed with dark joints (tileable)
    const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = '#6e665d'; g.fillRect(0,0,S,S);
    let rnd = 11; const R = () => (rnd = (rnd*16807) % 2147483647) / 2147483647;
    const palette = [[156,150,141],[178,171,160],[196,189,177],[143,128,112],[165,145,124],[128,124,118],[205,198,186],[150,138,126]];
    const stones = [];
    function addStone(x, y, r){
      const base = palette[Math.floor(R()*palette.length)], v = (R()-0.5)*30;
      const pts = [], n = 9 + Math.floor(R()*5), flat = 0.6 + R()*0.3;
      for (let i=0;i<n;i++){
        const a = i/n*Math.PI*2 + (R()-0.5)*0.4, k = 0.72 + R()*0.38;
        pts.push([Math.cos(a)*r*k, Math.sin(a)*r*k*flat]);
      }
      stones.push({x, y, rot:(R()-0.5)*0.9, col:base.map(c => Math.max(0, Math.min(255, c + v))), pts, r});
    }
    for (let i=0;i<340;i++) addStone(R()*S, R()*S, 7 + R()*10);          // small fillers
    const cell = 58;
    for (let gy = 0; gy < S/cell; gy++) for (let gx = 0; gx < S/cell; gx++){
      const big = R() < 0.25;
      addStone((gx+0.5)*cell + (R()-0.5)*cell*0.6, (gy+0.5)*cell + (R()-0.5)*cell*0.6,
               cell*(big ? 0.62 + R()*0.18 : 0.38 + R()*0.2));
    }
    const path = (p) => {
      g.beginPath();
      for (let i=0;i<p.length;i++){
        const a = p[i], b = p[(i+1)%p.length], m = [(a[0]+b[0])/2, (a[1]+b[1])/2];
        if (i === 0) g.moveTo(m[0], m[1]); else g.quadraticCurveTo(a[0], a[1], m[0], m[1]);
      }
      const a = p[0], b = p[1]; g.quadraticCurveTo(a[0], a[1], (a[0]+b[0])/2, (a[1]+b[1])/2);
      g.closePath();
    };
    stones.forEach(st => {
      for (const ox of [-S,0,S]) for (const oy of [-S,0,S]){
        const cx = st.x + ox, cy = st.y + oy;
        if (cx < -st.r*1.3 || cx > S+st.r*1.3 || cy < -st.r*1.3 || cy > S+st.r*1.3) continue;
        g.save(); g.translate(cx, cy); g.rotate(st.rot);
        // drop shadow in the joint
        g.save(); g.translate(2, 3); path(st.pts); g.fillStyle = 'rgba(25,20,16,0.55)'; g.fill(); g.restore();
        path(st.pts);
        const [r0,g0,b0] = st.col;
        g.rotate(-st.rot);
        const gr = g.createRadialGradient(-st.r*0.35, -st.r*0.4, st.r*0.1, 0, 0, st.r*1.05);
        gr.addColorStop(0, `rgb(${Math.min(255,r0+22)},${Math.min(255,g0+20)},${Math.min(255,b0+18)})`);
        gr.addColorStop(0.6, `rgb(${r0},${g0},${b0})`);
        gr.addColorStop(1, `rgb(${r0*0.62|0},${g0*0.6|0},${b0*0.58|0})`);
        g.fillStyle = gr; g.fill();
        g.save(); g.clip();
        for (let i=0;i<70;i++){   // granite speckles
          const d = R() < 0.5 ? 0 : 255;

    let used = 0;
    const all = Object.values(ROOMS).flatMap(r => r.lights.map(l => [l, r.on]));
    all.sort((a, b) => (a[0].userData.bounce ? 1 : 0) - (b[0].userData.bounce ? 1 : 0));   // main lights first
    all.forEach(([l, on]) => {
      const bounceOk = !l.userData.bounce || quality === 'high';
      let cast = false;
      if (l.userData.wantsShadow && on && bounceOk && used < budget){ cast = true; used++; }
      // a bounce light without a shadow would shine through walls, so it stays off
      if (l.userData.bounce) l.intensity = (on && bounceOk && (cast || !l.userData.wantsShadow)) ? l.userData.onI : 0;

        const f = new THREE.Vector3(0, 0, -1).applyQuaternion(headQuat()), lookingUp = f.y > 0.55;
        if (lookingUp && !askPanel.userData.upPlaced){ placeInFront(askPanel, 0.8, 0); askPanel.userData.upPlaced = true; }
        if (!lookingUp && now - lastSeatTime > 6000 && !ctrls.some(c => c.userData.ui)) hideAsk();
      }
    }
    marker.visible = !!tgt && vrState !== 'seated';
    if (tgt) marker.position.set(tgt.x, tgt.y + 0.012, tgt.z);
    const session = renderer.xr.getSession();
    if (session && vrState !== 'seated') for (const src of session.inputSources){
      const gp = src.gamepad; if (!gp || gp.axes.length < 4) continue;
      const x = gp.axes[2], k = src.handedness;
      if (Math.abs(x) > 0.7 && !turnLatch[k]){ snapTurn(x > 0 ? -Math.PI/6 : Math.PI/6); turnLatch[k] = true; hideAsk(); }
      else if (Math.abs(x) < 0.3) turnLatch[k] = false;
    }
  }
  async function enterVR(){
    const session = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor', 'bounded-floor']});
    let started = false, lastErr = null;
    for (const type of ['local-floor', 'local']){
      try {
        renderer.xr.setReferenceSpaceType(type);
        await renderer.xr.setSession(session);
        floorOff = type === 'local' ? 1.6 : 0;
        started = true; break;
      } catch (e){ lastErr = e; }
    }
    if (!started){ try { await session.end(); } catch (e) {} throw lastErr || new Error('the headset did not start the session'); }
    anim = null; mode = 'walk'; controls.enabled = false; show(null); syncVis();
    camera.position.set(0, 0, 0); camera.quaternion.identity();
    const s = SPOTS.lounge;
    rig.position.set(s.x + OFF[0], floorOff, s.z + OFF[1]); rig.rotation.set(0, s.yaw, 0);
    vrState = 'free'; saved = null;
    renderer.shadowMap.needsUpdate = true;
    vrBtn.textContent = 'Exit VR';
    session.addEventListener('end', () => {
      askPanel.visible = upPanel.visible = errPanel.visible = false; vrState = 'free'; saved = null;
      rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0);
      renderer.shadowMap.needsUpdate = true;
      camera.fov = ORBIT_FOV; camera.updateProjectionMatrix();
      camera.position.copy(OVERVIEW.pos); camera.quaternion.copy(quatLookAt(OVERVIEW.pos, OVERVIEW.target));
      mode = 'orbit'; controls.target.copy(OVERVIEW.target); controls.enabled = true;
      sel.value = 'overview'; marker.visible = false; vrBtn.textContent = 'Enter VR';
      syncVis(); setHint();
    });
  }
  if (navigator.xr && navigator.xr.isSessionSupported){
    navigator.xr.isSessionSupported('immersive-vr').then(ok => { vrBtn.hidden = !ok; }).catch(() => {});
  }
  vrBtn.addEventListener('click', () => {
    const s = renderer.xr.getSession();
    if (s) s.end();
    else enterVR().catch(err => { hint.hidden = false; hint.textContent = 'Could not start VR: ' + (err && err.message ? err.message : err); });
  });

  // environment lighting for every physically based material
  {
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
    envMats = new Set();
    scene.traverse(o => { if (o.isMesh || o.isInstancedMesh) [].concat(o.material).forEach(m => { if (m && m.isMeshStandardMaterial) envMats.add(m); }); });
    envMats.forEach(m => m.envMapIntensity = envK * (m.userData.envBoost || 1));
  }
  const outdoorEnv = scene.environment, outdoorMats = new Set();
  envG.traverse(o => { if (o.isMesh || o.isInstancedMesh) [].concat(o.material).forEach(m => { if (m && m.isMeshStandardMaterial) outdoorMats.add(m); }); });
  [mats.stone, mats.stoneDS, mats.trim].forEach(m => outdoorMats.add(m));
  outdoorMats.forEach(m => { m.envMap = outdoorEnv; m.needsUpdate = true; });
  const indoorMats = [...envMats].filter(m => !outdoorMats.has(m));
  envMats = outdoorMats;                                   // the time of day only scales the outdoor environment
  const PROBE_K = 0.9;
  // Low has no light bouncing, so lit rooms get a soft warm all-round light from a warm environment instead (costs nothing extra)
  const warmEnv = (() => {
    const re = new THREE.RoomEnvironment(), tint = new THREE.Color(1.0, 0.72, 0.45);
    re.traverse(o => { if (o.material && o.material.color) o.material.color.multiply(tint); });
    return new THREE.PMREMGenerator(renderer).fromScene(re, 0.04).texture;
  })();
  const LOW_GLOW = {spots:0.16, island:0.04, cabinet:0.03, deckSpots:0.05, bedroom:0.1, bathroom:0.05, bedLampA:0.03, bedLampB:0.03, mezzLampA:0.02, mezzLampB:0.02};
  function applyIndoorEnv(){
    if (quality === 'low'){
      const glow = Math.min(0.26, Object.keys(LOW_GLOW).reduce((t, k) => t + (ROOMS[k] && ROOMS[k].on ? LOW_GLOW[k] : 0), 0));
      const useWarm = glow > envK;
      scene.environment = useWarm ? warmEnv : outdoorEnv;
      indoorMats.forEach(m => m.envMapIntensity = (useWarm ? glow : envK) * (m.userData.envBoost || 1));
    } else requestProbe();
  }
  const probeRT = new THREE.WebGLCubeRenderTarget(128, {type:THREE.HalfFloatType});
  const probeCam = new THREE.CubeCamera(0.1, 400, probeRT);
  probeCam.position.set(7.8 + OFF[0], 1.4, 2.3 + OFF[1]); scene.add(probeCam);
  const probePM = new THREE.PMREMGenerator(renderer);
  let probeTex = null;
  function captureProbe(){
    probeDirty = false;
    const hide = [marker, hl, ...labels].filter(o => o.visible); hide.forEach(o => o.visible = false);
    scene.environment = null;                              // one bounce: capture without the previous capture
    camera.getWorldPosition(skyDome.position);
    probeCam.update(renderer, scene);
    const old = probeTex; probeTex = probePM.fromCubemap(probeRT.texture).texture; if (old) old.dispose();
    scene.environment = probeTex;
    indoorMats.forEach(m => m.envMapIntensity = PROBE_K * (m.userData.envBoost || 1));
    hide.forEach(o => o.visible = true);
  }

  renderer.setAnimationLoop(function loop(){
    if (probeDirty){ if (quality === 'low') probeDirty = false; else captureProbe(); }
    camera.getWorldPosition(skyDome.position);
    if (renderer.xr.isPresenting){
      try { vrUpdate(); } catch (e){ showVRError(e); }
      renderer.render(scene, camera); return;
    }
    if (anim){
      const t = Math.min(1, (performance.now() - anim.t0) / anim.dur), e = ease(t);
      camera.position.lerpVectors(anim.p0, anim.p1, e);
      camera.quaternion.copy(anim.q0).slerp(anim.q1, e);
      camera.fov = anim.f0 + (anim.f1 - anim.f0) * e;
      camera.updateProjectionMatrix();
      if (t >= 1){ const cb = anim.onDone; anim = null; if (cb) cb(); }
    } else if (mode === 'orbit' && !ctrlLook){
      controls.update();
    }
    renderer.render(scene, camera);
  });
})();
